[project]
name = "multi-harness-rl-course"
version = "0.1.0"
description = "Runnable code for the Multi-harness RL course: one self-contained folder per chapter."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
    "mlx>=0.32.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "numpy>=2.5.3",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
