[project]
name = "multi-harness-rl-course"
version = "0.1.0"
description = "Runnable code for the Multi-harness RL course: one self-contained folder per chapter."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "huggingface-hub>=1.33.0",
    "jinja2>=3.1.6",
    "mlx>=0.32.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "mlx-lm>=0.32.0 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "numpy>=2.5.3",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "tokenizers>=0.23.2",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
